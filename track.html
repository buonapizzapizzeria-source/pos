<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.wrap{max-width:480px;margin:0 auto}
.brand{text-align:center;font-weight:800;font-size:20px;margin:6px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:14px;margin:0}
.big{font-size:44px;text-align:center;margin:6px 0}
.steps{list-style:none;margin:16px 0 0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:10px 0;position:relative;color:var(--mut)}
.steps li:not(:last-child)::after{content:"";position:absolute;left:15px;top:38px;width:2px;height:22px;background:var(--off)}
.dot{width:32px;height:32px;border-radius:50%;background:var(--off);display:grid;place-items:center;font-size:15px;flex:none;color:#fff}
.steps li.done{color:var(--ink)}.steps li.done .dot{background:var(--ok)}
.steps li.done:not(:last-child)::after{background:var(--ok)}
.steps li.now{color:var(--ink);font-weight:800}.steps li.now .dot{background:var(--run);animation:p 1.4s infinite}
@keyframes p{50%{transform:scale(1.12);box-shadow:0 0 0 6px #e8590c33}}
.items div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:15px}
.items div:last-child{border:0}
.tot{display:flex;justify-content:space-between;font-weight:800;margin-top:8px}
.err{text-align:center;color:var(--mut)}
.upd{text-align:center;color:var(--mut);font-size:12px}
.cancel .big{filter:grayscale(1)}
.rb{display:block;text-align:center;margin-top:14px;padding:12px;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;text-decoration:none}
@keyframes bpflash{0%{box-shadow:0 0 0 0 rgba(18,183,106,.7)}100%{box-shadow:0 0 0 22px rgba(18,183,106,0)}}.bpflash{animation:bpflash 1.1s ease-out 2}
.lc{background:linear-gradient(160deg,#3b1e15,#220f09);color:#fff;border-radius:20px;padding:14px 14px 12px;box-shadow:0 8px 22px rgba(60,20,5,.28)}
.lc small{display:block;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;opacity:.65;font-weight:700}
.lc .lh{display:flex;align-items:center;gap:10px}
.lc .lh img{width:38px;height:38px;border-radius:9px;flex:0 0 auto}
.lc .lh>div:nth-child(2){flex:1;min-width:0}
.lc .lh b{font-size:16px;line-height:1.15;display:block}
.lc .lh .lt{text-align:right;flex:0 0 auto}
.lc .lh .lt b{font-size:20px;font-variant-numeric:tabular-nums}
.lc .lr{display:flex;justify-content:space-between;gap:4px;margin:14px 0 12px}
.lc .lr svg{flex:1 1 0;min-width:0;max-width:56px;height:auto;aspect-ratio:1;transition:transform .2s}
.lc .lr svg:not(.on){opacity:.22;filter:grayscale(1)}
.lc .lr svg.on{filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
.lc .lf{display:grid;grid-template-columns:1.3fr .8fr 1fr;gap:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.12)}
.lc .lf b{display:block;font-size:14px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.lm{font-size:12.5px;color:var(--mut);margin:8px 2px 0;line-height:1.4}
.lc{margin-top:14px;text-align:left}.lc .lr svg.pop{animation:lpop .7s ease-out}@keyframes lpop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.lenc{margin:8px 2px 0;font-size:14px;line-height:1.4;text-align:center;font-weight:700;color:#f8c24a}
.sap{margin-top:12px;background:linear-gradient(135deg,#fff3e3,#ffe4d1);border:1.5px solid #e8590c;color:#7a2e0e;border-radius:14px;padding:10px 12px;cursor:pointer;transition:opacity .35s}
.sap small{display:block;font-size:11px;letter-spacing:.8px;text-transform:uppercase;font-weight:800;opacity:.75}
.sap p{margin:4px 0 0;font-size:14.5px;font-weight:650;line-height:1.4}
.sap.f{opacity:0}
@media(prefers-color-scheme:dark){.sap{background:linear-gradient(135deg,#2e2016,#2a1a12);color:#ffd9b8}}

.ico{width:84px;height:84px;margin:4px auto 6px;display:block}
.ico *{transform-box:fill-box;transform-origin:center}
.hg-t{animation:hgspin 3s ease-in-out infinite;transform-origin:50% 50%}
@keyframes hgspin{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(180deg)}}
.hg-s{animation:hgsand 3s ease-in-out infinite}
@keyframes hgsand{0%,40%{opacity:1}50%{opacity:.2}60%,100%{opacity:1}}
.dough{animation:dspin 2.6s linear infinite}
@keyframes dspin{to{transform:rotate(360deg)}}
.fl{animation:fl .5s ease-in-out infinite alternate}
.fl2{animation:fl .38s ease-in-out infinite alternate-reverse}
@keyframes fl{0%{transform:scale(1,.88) rotate(-4deg)}100%{transform:scale(1.08,1.12) rotate(4deg)}}
.st{animation:steam 2.2s ease-out infinite;opacity:0}
.st:nth-of-type(2){animation-delay:.7s}.st:nth-of-type(3){animation-delay:1.4s}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}30%{opacity:.8}100%{opacity:0;transform:translateY(-14px)}}
.phr{margin:0 2px 14px;text-align:center;font-weight:700;font-size:15px;min-height:44px;transition:opacity .35s}
.phr.f{opacity:0}
.eta{margin:10px 0 0;text-align:center;font-size:14px;font-weight:700;color:var(--run)}
.sapw{margin:0 0 14px}.sapw:empty{display:none}
@media(prefers-reduced-motion:reduce){.hg-t,.hg-s,.dough,.fl,.fl2,.st{animation:none}.st{opacity:.5}}

.mi{display:block;max-width:100%;max-height:150px;margin:0 auto 6px;border-radius:12px;object-fit:cover}
.tw.side .mi{display:inline-block;width:54px;height:54px;max-height:none;margin:0 10px 0 0;vertical-align:middle}
.a-out{animation:var(--ao) var(--spd) ease-in forwards}.a-in{animation:var(--ai) var(--spd) ease-out both}

@keyframes so{to{opacity:0;transform:translateX(-40px)}}@keyframes si{from{opacity:0;transform:translateX(40px)}}

@keyframes zo{to{opacity:0;transform:scale(.6)}}@keyframes zi{from{opacity:0;transform:scale(.6)}}
@keyframes flo{to{transform:rotateX(90deg)}}@keyframes fli{from{transform:rotateX(-90deg)}}
@keyframes bo{to{opacity:0;transform:scale(.8)}}@keyframes bi{0%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.12)}80%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes blo{to{opacity:0;filter:blur(8px)}}@keyframes bli{from{opacity:0;filter:blur(8px)}}
.lc.th-gold{background:linear-gradient(160deg,#b8860b,#5c3d00)}.lc.th-red{background:linear-gradient(160deg,#c8102e,#6b0718)}
.lc.th-green{background:linear-gradient(160deg,#1f7a4d,#0b3b24)}.lc.th-blue{background:linear-gradient(160deg,#1c5fd6,#0b2a66)}
.lc.th-light{background:#fff;color:#1f2328;border:1.5px solid #f0d9a8}.lc.th-light .lf{border-color:#0001}
.lc.an-bounce .lr svg.pop{animation:lbo .9s ease-out}@keyframes lbo{0%{transform:translateY(-30px);opacity:0}50%{transform:translateY(0)}70%{transform:translateY(-8px)}100%{transform:none}}
.lc.an-spin .lr svg.pop{animation:lsp .9s ease-out}@keyframes lsp{from{transform:rotate(-360deg) scale(.2)}to{transform:none}}
.lc.an-glow .lr svg.on{animation:lgl 1.8s ease-in-out infinite alternate}@keyframes lgl{to{filter:drop-shadow(0 0 7px #ffd34d)}}
.lc .lbn{display:block;width:100%;max-height:120px;object-fit:cover;border-radius:12px;margin:0 0 10px}
.cel{position:fixed;top:-50px;font-size:30px;z-index:99;pointer-events:none;animation:celf linear forwards}
@keyframes celf{to{transform:translateY(110vh) rotate(360deg)}}
.celm{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.4);z-index:100;background:#fff;color:#1f2328;border-radius:20px;padding:16px 22px;font-weight:900;font-size:20px;text-align:center;box-shadow:0 12px 40px #0005;opacity:0;transition:.35s;pointer-events:none}
.celm.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media(prefers-reduced-motion:reduce){.a-out,.a-in,.cel{animation:none!important}}
</style>

  spd=Math.max(100,Number(spd)||350);el.style.setProperty('--spd',spd+'ms');
  if(anim==='none'||first){el.innerHTML=html;return}
  if(anim==='type'){var tmp=document.createElement('div');tmp.innerHTML=html;var sp=tmp.querySelector('span'),full=sp?sp.textContent:'',i=0;if(sp)sp.textContent='';el.innerHTML=tmp.innerHTML;var t=el.querySelector('span');clearInterval(el._tw);var st=Math.max(15,Math.min(60,spd/Math.max(1,full.length)*4));el._tw=setInterval(function(){if(!t||i>=full.length){clearInterval(el._tw);return}t.textContent=full.slice(0,++i)},st);return}
  var a=AN[anim]||AN.fade;el.style.setProperty('--ao',a[0]);el.style.setProperty('--ai',a[1]);
  el.classList.remove('a-in');el.classList.add('a-out');
  setTimeout(function(){el.innerHTML=html;el.classList.remove('a-out');void el.offsetWidth;el.classList.add('a-in')},spd);
}
function fxList(){var f=TC.fx;return f&&f.list&&f.list.length?f.list.map(it2):FACTS.map(function(x){return{t:x[0]+' '+x[1]}})}
var FI=-1;
function factNext(){
  var L=fxList();if(TC.fx&&TC.fx.order==='seq'){FI=(FI+1)%L.length;return L[FI]}
  if(!FQ||!FQ.length||FQ._n!==L.length){FQ=L.slice();FQ._n=L.length;for(var i=FQ.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=FQ[i];FQ[i]=FQ[j];FQ[j]=t}if(FQ.length>1&&FQ[0]===FLAST)FQ.push(FQ.shift())}
  return FLAST=FQ.shift();
}
var FTM=0;
function factsMount(host){
  if(!host)return;clearInterval(FTM);var f=TC.fx||{};
  if(f.on===false){host.innerHTML='';return}
  var sec=Math.max(2,Number(f.sec)||8)*1000;
  host.innerHTML='<div class="sap tw'+(f.imgPos==='side'?' side':'')+'" role="button" aria-label="Prossima curiosità"><small>'+esc(f.title||'💡 Lo sapevi?')+'</small><p></p></div>';
  var box=host.firstChild,p=box.querySelector('p');
  function show(first){swap(p,itemHtml(factNext()),f.anim||'fade',f.spd||350,first)}
  show(true);
  function tick(){if(!document.body.contains(box)){clearInterval(FTM);return}show()}
  box.onclick=function(){clearInterval(FTM);show();FTM=setInterval(tick,sec)};
  FTM=setInterval(tick,sec);
}
window.BPFACTS={mount:factsMount,list:FACTS};

/* ====== FASE 3: icone animate, frasi per stato, tempo stimato ====== */
/* --- frasi per stato: modificale qui (2-3 per stato + le generiche) --- */
var PH_ALL=['Ottima scelta! 😋','Il pizzaiolo approva 👨‍🍳👍','Gusto da vero intenditore 🤌','Mmm… già sentiamo il profumo! 👃','Mangiare bene è una cosa seria 😌','Il tuo stomaco ti ringrazia 🙏','Sorriso garantito 😄'];
var PH={
 'Nuovo':['Il pizzaiolo sta leggendo il tuo ordine 👀','Controlliamo che sia tutto perfetto ✅'],
 'In preparazione':['Stendiamo la tua pizza a mano 🤌','Il forno è a 450°, ci siamo! 🔥','Ingredienti freschi, tanto amore ❤️'],
 'Pronto':['È appena uscita dal forno, vieni finché è bollente! 🔥','Ti aspettiamo con un sorriso 😄'],
 'In consegna':['Il fattorino sta arrivando da te 🛵','Tieni il citofono a portata di mano 😉'],
 'Completato':['Buon appetito! Ci vediamo alla prossima fetta 🍕','Grazie di aver scelto Buona Pizza ❤️'],
 'Annullato':['Ci dispiace! Chiamaci se hai domande 📞']
};
var phSt=null,phLast='',phTM=0,phQ=[];
function phNext(){
  var c=TC.phr||{},stl=c.st&&c.st[phSt]?c.st[phSt]:(PH[phSt]||[]),all=c.all||PH_ALL;
  if(!phQ.length){
    var base=stl.slice(),gen=(phSt==='Completato'||phSt==='Annullato'||c.mix===false)?[]:all.slice();
    for(var i=gen.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=gen[i];gen[i]=gen[j];gen[j]=t}
    phQ=base.concat(gen.slice(0,Math.max(0,c.nmix==null?3:Number(c.nmix))));
    if(c.order!=='seq')for(var k=phQ.length-1;k>0;k--){var m=Math.floor(Math.random()*(k+1)),u=phQ[k];phQ[k]=phQ[m];phQ[m]=u}
    if(phQ.length>1&&phQ[0]===phLast){phQ.push(phQ.shift())}
  }
  return phLast=phQ.shift();
}
function phShow(first){
  var el=document.getElementById('phr'),c=TC.phr||{}; if(!el) return;
  el.classList.toggle('side',c.imgPos==='side');if(c.size)el.style.fontSize=Number(c.size)+'px';
  var f=phNext();if(f==null){el.innerHTML='';return}
  swap(el,itemHtml(f),c.anim||'fade',c.spd||350,first);
}
function phSet(st,force){
  if(st===phSt&&!force) return; phSt=st; phQ=[]; clearInterval(phTM);
  var c=TC.phr||{},el=document.getElementById('phr');
  if(c.on===false){if(el)el.innerHTML='';return}
  phShow(true);
  if(st!=='Completato'&&st!=='Annullato') phTM=setInterval(function(){phShow(false)},Math.max(2,Number(c.sec)||6)*1000);
}
async function tcLoad(){
  try{var r=await sb.rpc('get_track_settings');if(!r.error&&r.data&&r.data.cfg){TC=r.data.cfg;
    if(phSt)phSet(phSt,true);var sw=document.getElementById('sapT');if(sw&&sw.firstChild)factsMount(sw);loyPaintT();}}catch(_){}
}
/* --- icone animate (SVG + CSS, niente GIF) --- */
function icoSvg(st,pend){
  if(pend&&st==='Nuovo'||st==='Nuovo')
    return '<svg class="ico" viewBox="0 0 64 64"><g class="hg-t"><path d="M16 6h32M16 58h32" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/><path d="M20 8c0 14 12 16 12 24S20 42 20 56M44 8c0 14-12 16-12 24s12 10 12 24" fill="none" stroke="#8a5a2b" stroke-width="3"/><path class="hg-s" d="M23 12h18c-2 8-9 10-9 14-0-4-7-6-9-14Z" fill="#f8c24a"/><path class="hg-s" d="M32 40c4 4 8 8 9 14H23c1-6 5-10 9-14Z" fill="#f8c24a"/></g></svg>';
  if(st==='In preparazione')
    return '<svg class="ico" viewBox="0 0 64 64"><g class="dough"><circle cx="32" cy="32" r="22" fill="#f3d9a4" stroke="#d9a85c" stroke-width="3"/><circle cx="32" cy="32" r="15" fill="#f8e6bd"/><circle cx="26" cy="28" r="2" fill="#e9c680"/><circle cx="38" cy="36" r="2" fill="#e9c680"/><circle cx="33" cy="26" r="1.6" fill="#e9c680"/></g><g class="fl"><path d="M50 58c-6-4-7-10-3-16 1 4 4 4 5 2 4 4 4 10-2 14Z" fill="#e8590c"/><path d="M50 58c-3-2-3-5-1-8 2 2 4 4 1 8Z" fill="#f8c24a"/></g></svg>';
  if(st==='Pronto')
    return '<svg class="ico" viewBox="0 0 64 64"><path class="st" d="M22 22c-3-4 3-6 0-10" fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round"/><path class="st" d="M32 22c-3-4 3-6 0-10" fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round"/><path class="st" d="M42 22c-3-4 3-6 0-10" fill="none" stroke="#9aa3ad" stroke-width="2.5" stroke-linecap="round"/><g transform="translate(6 14) scale(.9)"><use href="#pzs"/></g></svg>';
  return null;
}
/* --- tempo stimato --- */
var PREP_MIN=20;
async function prepLoad(){ try{ var r=await sb.rpc('get_prep_settings'); if(!r.error&&r.data&&Number(r.data.min)>0) PREP_MIN=Number(r.data.min); }catch(_){} }
function fmtHM(d){return d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}
function etaHtml(o){
  var st=o.status||'Nuovo';
  if(st!=='Nuovo'&&st!=='In preparazione') return '';
  if(/^\d\d:\d\d$/.test(String(o.pickup_time||''))) return '🕒 Ritiro previsto alle '+o.pickup_time;
  var cr=o.created_at||o.date||null, cd=cr?new Date(cr):null;
  if(!cd||isNaN(cd)) return '🕒 Tempo medio di preparazione: circa '+PREP_MIN+' minuti';
  var left=Math.ceil((cd.getTime()+PREP_MIN*60000-Date.now())/60000);
  return left>0 ? '🕒 Pronto tra circa '+left+' min' : 'Ci vuole qualche minuto in più, ma ne vale la pena! 🙏';
}
var lastO=null;
function etaTick(){ var el=document.getElementById('eta'); if(el&&lastO) el.innerHTML=etaHtml(lastO); }
setInterval(etaTick,20000);
prepLoad();tcLoad();
var loyKey='';
function render(o){
  try{ var lk=(o.status||'')+'|'+(o.pending?1:0); if(lk!==loyKey){ loyKey=lk; loyLoad(o); } }catch(_){}
  var st = o.status || 'Nuovo'; lastO=o;
  var h = (o.pending && st==='Nuovo') ? ['⏳','In attesa di conferma','Il locale sta per confermare il tuo ordine.'] : (HEAD[st] || HEAD['Nuovo']);
  var steps = flow(o.order_type), idx = steps.findIndex(function(s){return s[0]===st});
  var list = '';
  if(st !== 'Annullato'){
    list = '<ul class="steps">'+steps.map(function(s,i){
      var cls = idx<0 ? '' : (i<idx?'done':(i===idx?'now':''));
      return '<li class="'+cls+'"><span class="dot">'+(i<idx?'✓':s[1])+'</span>'+esc(s[2])+'</li>';
    }).join('')+'</ul>';
  }
  var items = (o.items||[]).map(function(i){
    return '<div><span>'+esc(i.qty)+'× '+esc(i.name)+(i.size&&i.size!=='Normale'?' ('+esc(i.size)+')':'')+'</span></div>';
  }).join('');
  var ic = icoSvg(st, o.pending);
  var eta = etaHtml(o);
  root.innerHTML =
   '<div class="card '+(st==='Annullato'?'cancel':'')+'">'+
     (ic || '<div class="big">'+h[0]+'</div>')+
     '<h1 style="text-align:center">'+esc(h[1])+'</h1>'+
     '<p class="sub" style="text-align:center">'+(o.first_name?'Ciao '+esc(o.first_name)+'. ':'')+esc(h[2])+'</p>'+
     '<p class="eta" id="eta">'+eta+'</p>'+
     list+(st==='Completato'?'<a class="rb" href="rate.html?t='+encodeURIComponent(token)+'">⭐ Valuta il tuo ordine</a>':'')+
   '</div>';
  document.getElementById('root2').innerHTML =
   '<div class="card"><strong>Ordine #'+esc(o.id)+'</strong>'+
     '<div class="items" style="margin-top:8px">'+items+'</div>'+
     '<div class="tot"><span>Totale</span><span>'+euro(o.total)+'</span></div></div>';
  phSet(st);
  var sw=document.getElementById('sapT'), fin=(st==='Completato'||st==='Annullato');
  if(fin){ clearInterval(FTM); sw.innerHTML=''; } else if(!sw.firstChild){ factsMount(sw); }
  if(fin) document.getElementById('phr').style.display = (st==='Annullato'?'none':''); else document.getElementById('phr').style.display='';
  document.getElementById('upd').textContent = 'Aggiornato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+' · si aggiorna da solo';
}

var timer = null, busy = false, lastSig = '', lastStatus = null, fails = 0, done = false;
var POLL_MS = 3000;
function stamp(){
  document.getElementById('upd').textContent = 'Aggiornato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · si aggiorna da solo';
}
async function load(){
  if(!token){ root.innerHTML='<div class="card err">Link non valido.</div>'; return; }
  if(busy || done) return;
  busy = true;
  try{
    var r = await sb.rpc('get_order_tracking', {p_token: token});
    if(r.error) throw r.error;
    if(!r.data){ root.innerHTML='<div class="card err">Ordine non trovato. Controlla il link.</div>'; done = true; return; }
    fails = 0;
    var o = r.data, sig = JSON.stringify([o.status, o.pending, o.total, o.items]);
    if(sig !== lastSig){
      var changed = lastStatus !== null && o.status !== lastStatus;
      lastSig = sig; lastStatus = o.status;
      render(o);
      if(changed){
        try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
        var c = document.querySelector('.card'); if(c){ c.classList.add('bpflash'); }
      }
    }
    stamp();
    if(o.status==='Completato' || o.status==='Annullato'){ done = true; clearInterval(timer); }
  }catch(e){
    fails++;
    if(!document.querySelector('.steps')) root.innerHTML='<div class="card err">Impossibile caricare l’ordine. Riprova tra poco.<br><small>'+esc((e&&e.message)||e)+'</small></div>';
  }finally{ busy = false; }
}
function tick(){ if(!document.hidden && (fails < 5 || Date.now()%5 === 0)) load(); }
load();
timer = setInterval(tick, POLL_MS);
document.addEventListener('visibilitychange', function(){ if(!document.hidden) load(); });
window.addEventListener('online', load);
window.addEventListener('focus', load);
</script>
