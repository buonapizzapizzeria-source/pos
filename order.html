<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Ordina · Buona Pizza</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e2a20;--pa:#f3ead8;--ink:#1d1a14;--go:#c9a55c;--go2:#e3c887;--bo:#7a1626;--mu:#a9b8ac;--ln:rgba(201,165,92,.3);--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg) radial-gradient(120% 55% at 50% -8%,#18432f,transparent 62%) no-repeat;color:var(--pa);font:400 16px/1.5 var(--sans);padding-bottom:120px}
button{font:inherit;cursor:pointer}
.hide{display:none!important}.mu,.mut{color:var(--mu);font-size:14px}
.wrap{max-width:720px;margin:0 auto}
@keyframes in{from{opacity:0;transform:translateY(12px)}}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes pop{40%{transform:scale(1.35)}}
/* testata */
.hero{text-align:center;padding:max(28px,env(safe-area-inset-top)) 20px 14px;animation:in .9s cubic-bezier(.2,.8,.2,1) both}
.tri{width:84px;height:3px;margin:0 auto 20px;background:linear-gradient(90deg,#2f8f5b 0 33.3%,#f3ead8 33.3% 66.6%,#b3263a 66.6%)}
.hero h1{font:italic 500 clamp(46px,14vw,70px)/.95 var(--serif);margin:0}
.hero p{margin:12px 0 0;color:var(--go2);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.hero .ad{margin-top:4px;color:var(--mu);letter-spacing:.06em;text-transform:none;font:italic 16px var(--serif)}
#tv{text-align:center;margin:14px 20px 6px;animation:in 1s .15s cubic-bezier(.2,.8,.2,1) both}
.ring{width:136px;height:136px;margin:0 auto 14px;border-radius:50%;border:1px solid var(--go);box-shadow:0 0 0 6px var(--bg),0 0 0 7px var(--ln);display:grid;place-content:center;text-align:center}
.ring small{font:italic 18px/1 var(--serif);color:var(--go2)}
.ring b{font:500 60px/1 var(--serif)}
#tv h2{font:italic 500 30px/1.1 var(--serif);margin:0 0 4px}
#tv p{margin:0 auto;max-width:34ch;color:var(--mu);font-size:15px}
#note{margin:12px 18px 0;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;text-align:center;color:var(--pa);font-size:14.5px}
/* ricerca + categorie */
.top{position:sticky;top:0;z-index:6;padding:max(6px,env(safe-area-inset-top)) 0 0;background:linear-gradient(var(--bg) 90%,transparent);margin-top:10px}
.sr{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);padding:6px 2px;margin:0 18px;color:var(--go)}
.sr input{flex:1;min-width:0;background:none;border:0;color:var(--pa);font:inherit;font-size:16px;outline:0;padding:8px 0}
.sr input::placeholder{color:var(--mu)}
.sr:focus-within{border-color:var(--go)}
.tabs{display:flex;gap:24px;overflow-x:auto;padding:12px 18px 0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tb{flex:none;background:none;border:0;color:var(--mu);font:italic 500 22px var(--serif);padding:2px 0 8px;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tb sup{font:500 11px var(--sans);margin-left:4px;opacity:.7}
.tb.on{color:var(--pa);border-color:var(--go)}
/* la carta */
#list{padding:4px 18px}
.cat{font:italic 500 32px/1.1 var(--serif);color:var(--go2);margin:28px 0 4px;display:flex;align-items:center;gap:16px}
.cat:after{content:"";flex:1;height:1px;background:var(--ln)}
.it{position:relative;padding:16px 0;border-bottom:1px solid rgba(201,165,92,.12)}
.it.has:before{content:"";position:absolute;left:-10px;top:16px;bottom:16px;width:2px;background:var(--go)}
.hd{display:flex;align-items:baseline;gap:10px}
.hd h3{margin:0;font:600 23px/1.15 var(--serif)}
.dots{flex:1;min-width:12px;border-bottom:1px dotted rgba(201,165,92,.55);transform:translateY(-4px)}
.pr{font:500 20px var(--serif);color:var(--go2);white-space:nowrap}
.ds{margin:4px 0 0;max-width:54ch;font:italic 400 17px/1.35 var(--serif);color:var(--mu)}
.ac{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
.bt{min-height:40px;padding:8px 18px;border:1px solid var(--go);border-radius:99px;background:none;color:var(--go2);font:500 14px var(--sans);transition:transform .12s}
.bt.f{background:var(--go);color:var(--ink);font-weight:600}
.bt:active{transform:scale(.95)}
.lk{margin-left:auto;padding:8px 4px;background:none;border:0;color:var(--mu);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.st{display:inline-flex;align-items:center;border:1px solid var(--go);border-radius:99px;background:rgba(201,165,92,.08)}
.st button{width:42px;height:40px;border:0;background:none;color:var(--go2);font-size:21px}
.st b{min-width:24px;text-align:center;font:600 19px var(--serif)}
.pop .st b{animation:pop .35s}
.empty{padding:40px 0;text-align:center;color:var(--mu);font:italic 20px var(--serif)}
/* barra ordine */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:12px 16px max(14px,env(safe-area-inset-bottom));pointer-events:none}
.bar button{pointer-events:auto;display:flex;align-items:center;width:100%;max-width:560px;margin:0 auto;padding:7px;border:1px solid var(--go);border-radius:99px;background:var(--bo);color:var(--pa);box-shadow:0 16px 36px rgba(0,0,0,.55)}
.bar .c{width:42px;height:42px;border-radius:50%;background:var(--go);color:var(--ink);display:grid;place-items:center;font:700 18px var(--serif)}
.bar .l{flex:1;text-align:left;padding-left:14px;font-weight:500}
.bar .t{padding-right:16px;font:600 21px var(--serif)}
.bar.bump button{animation:pop .3s}
/* fogli (carta avorio) */
.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,14,9,.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.box{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:24px 20px max(20px,env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:var(--pa);color:var(--ink);animation:up .35s cubic-bezier(.2,.8,.2,1)}
.box h2{margin:0 0 6px;font:italic 500 34px/1 var(--serif);color:var(--bo)}
.box .mu,.box .mut{color:#6b6454}
.tvb{display:inline-block;margin-bottom:10px;padding:4px 14px;border:1px solid var(--bo);border-radius:99px;color:var(--bo);font-weight:600;font-size:13px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dotted #bfb08c}
.ln b{font:600 20px var(--serif)}
.mods{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500}
.tag.no{background:#f3d3d6;color:#7a1626;text-decoration:line-through}.tag.ex{background:#d5e9dc;color:#1c6a3d}
.q2{display:flex;align-items:center;gap:10px}
.q2 button{width:36px;height:36px;border-radius:50%;border:1px solid #b9a97f;background:none;color:var(--ink);font-size:19px}
.tot{display:flex;justify-content:space-between;padding:5px 0}
.tot.g{margin-top:6px;padding-top:12px;border-top:1px solid var(--ink);font:600 26px var(--serif);color:var(--bo)}
label{display:block;margin:14px 0 5px;font-size:13.5px;font-weight:500;color:#4d4636}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid #cdbf9f;border-radius:12px;background:#fffaf0;color:var(--ink);font:inherit;font-size:16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--bo);box-shadow:0 0 0 3px rgba(122,22,38,.15)}
.fam{margin:12px 0 2px;padding:12px 14px;border-left:2px solid var(--go);background:rgba(201,165,92,.14);font:italic 17px/1.35 var(--serif)}
.cta{display:block;width:100%;margin-top:14px;padding:15px;border:0;border-radius:99px;background:var(--bo);color:var(--pa);font:500 16px var(--sans);text-align:center;text-decoration:none;box-shadow:0 8px 20px rgba(122,22,38,.3)}
.cta:active{transform:scale(.98)}.cta:disabled{opacity:.6}
.cta.sec{background:none;color:#4d4636;box-shadow:none;margin-top:4px;padding:11px}
.err{margin-top:10px;padding:10px 12px;border-radius:10px;background:#f6dcdf;color:#7a1626;font-size:14px}
.sec-t{margin:18px 0 4px;font:italic 500 22px var(--serif);color:var(--bo)}
.ing{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.ing button{padding:8px 14px;border:1px solid #b9a97f;border-radius:99px;background:none;color:var(--ink);font-size:14px}
.ing.rm button.on{background:#f3d3d6;border-color:var(--bo);color:var(--bo);text-decoration:line-through}
.ing.ex button.on{background:#d5e9dc;border-color:#2f8f5b;color:#1c6a3d}
.ing small{opacity:.7}
.seg{display:flex;gap:8px;margin-top:12px}
.seg button{flex:1;padding:11px;border:1px solid #b9a97f;border-radius:12px;background:none;color:var(--ink);font-weight:500}
.seg button.on{border-color:var(--bo);background:rgba(122,22,38,.08);color:var(--bo)}
.srch{margin:6px 0}
.done{text-align:center;padding:8px 0}
.done .no{font:500 64px/1 var(--serif);color:var(--bo);margin:6px 0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="tri"></div><h1>Buona Pizza</h1><p>Pizzeria &amp; Kebap</p><p class="ad">Lodi Vecchio · Via Libertà 29</p></header>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient('https://jfgizazsjjgzyhqfngnl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmZ2l6YXpzampnenlocWZuZ25sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODI0ODEsImV4cCI6MjEwNzM1ODQ4MX0.Tp_bFfR-G55OaK5i3A0fi5gF6g7pc-a3LO_IDCpsuhE');

function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

function rank(c){var s=String(c||'').toLowerCase(),R=[/pizz/,/calzon/,/panin|kebab|burger/,/piadin/,/^\s*men[uù]/,/fritt|antipast|patatin/,/insalat/,/dolc|dessert/,/bibit|bevand|drink|birra|vin/],rk=[0,1,2,3,4,5,6,8,9];
  for(var i=0;i<R.length;i++){if(R[i].test(s))return rk[i]}return 7}

function ings(p){return String(p.description||'').split(/[,;·•+]+/).map(function(x){return x.trim()}).filter(Boolean)}
var COMMON=['Mozzarella','Mozzarella di Bufala','Pomodoro','Salame piccante','Prosciutto cotto','Prosciutto crudo','Funghi','Carciofi','Olive','Cipolla','Tonno','Acciughe','Kebab','Patatine','Wurstel','Gorgonzola','Rucola','Grana','Peperoni','Salsiccia','Origano','Nutella','Insalata','Salsa piccante','Salsa yogurt','Maionese','Ketchup','Uova','Pollo','Pancetta','Melanzane','Zucchine','Bresaola'];
function groupOf(n){var l=norm(n);
  if(/salsa|maionese|ketchup|panna|yogurt|senape|harissa|bbq|pesto/.test(l))return 'Salse';
  if(/mozzarella|gorgonzola|grana|scamorza|brie|provola|parmigiano|formaggio|ricotta|philadelphia/.test(l))return 'Formaggi';

  return 'Altro'}
function pool(){var seen={},out=[];COMMON.concat([].concat.apply([],M.menu.map(ings))).forEach(function(i){var k=norm(i);if(k&&!seen[k]){seen[k]=1;out.push(i)}});return out}

async function init(){
  try{
    var r=await sb.rpc('get_online_menu'); if(r.error||!r.data) throw (r.error||'no data');
    M=r.data;
    var open=mins(M.open),close=mins(M.close),now=mins(M.now);
    if(!M.enabled) note('Gli ordini online sono momentaneamente chiusi.<br><span class="mut">Chiamaci in pizzeria.</span>');
    else if(now<open||now>=close) note('Ordini online dalle <b>'+esc(M.open)+'</b> alle <b>'+esc(M.close)+'</b>.');
    else{canOrder=true;var x=[];if(M.fee>0&&M.free_from>0&&!TV)x.push('consegna a domicilio '+euro(M.fee)+' per ordini sotto '+euro(M.free_from)+', gratis da '+euro(M.free_from));x.push(TV?'si paga al tavolo':'si paga alla consegna o al ritiro');note('<span class="mut">'+esc(x.join(' · '))+'</span>')}
    if(TV){document.title='Tavolo '+TV+' · Buona Pizza';var t=$('tv');t.classList.remove('hide');t.innerHTML='<div class="ring"><small>Tavolo</small><b>'+TV+'</b></div><h2>Benvenuti</h2><p>Scegli, personalizza e invia: ti serviamo noi al tavolo. Buon appetito!</p>'}
    var seen=[];M.menu.forEach(function(p){var c=p.category||'Altro';if(seen.indexOf(c)<0)seen.push(c)});
    CATS=seen.map(function(c,i){return [c,i]}).sort(function(a,b){return rank(a[0])-rank(b[0])||a[1]-b[1]}).map(function(x){return x[0]});
    cat=CATS[0]||'__all';
    paintTabs();paintList();
  }catch(e){$('list').innerHTML='<div class="err" style="background:#f6dcdf">Impossibile caricare il menu.<br><small>'+esc((e&&e.message)||e)+'</small></div>'}
}
function cnt(c){return M.menu.filter(function(p){return (p.category||'Altro')===c}).length}
function paintTabs(){
  var all=[['__all','Tutti',M.menu.length]].concat(CATS.map(function(c){return [c,c,cnt(c)]}));
  $('chips').innerHTML=all.map(function(c){return '<button class="tb" data-c="'+esc(c[0])+'">'+esc(c[1])+'<sup>'+c[2]+'</sup></button>'}).join('');
  markTabs();
}
function markTabs(){document.querySelectorAll('#chips .tb').forEach(function(b){b.classList.toggle('on',!QS&&b.getAttribute('data-c')===cat)})}
function lines(){return Object.keys(cart).map(function(k){return cart[k]})}
function qtyOf(id){return lines().reduce(function(s,l){return String(l.id)===String(id)?s+l.qty:s},0)}
function sub(){return lines().reduce(function(s,l){return s+l.price*l.qty},0)}
function count(){return lines().reduce(function(s,l){return s+l.qty},0)}
function item(p){
  var n=qtyOf(p.id),id=esc(p.id),d=ings(p).join(', '),mx=p.pm>0;
  var h='<article class="it'+(n?' has':'')+(POP===String(p.id)?' pop':'')+'"><div class="hd"><h3>'+esc(p.name)+'</h3><i class="dots"></i><span class="pr">'+euro(p.pn)+(!canOrder&&mx?' / '+euro(p.pm):'')+'</span></div>'+(d?'<p class="ds">'+esc(d)+'</p>':'');
  if(canOrder){
    h+='<div class="ac">'+(n?'<span class="st"><button data-m="'+id+'" aria-label="Togli uno">−</button><b>'+n+'</b><button data-a="'+id+'|Normale" aria-label="Aggiungi uno">+</button></span>':'<button class="bt f" data-a="'+id+'|Normale">Aggiungi</button>')
      +(mx?'<button class="bt" data-a="'+id+'|Maxi">Maxi '+euro(p.pm)+'</button>':'')+'<button class="lk" data-g="'+id+'">Personalizza</button></div>';
  }

}
function paintList(){
  markTabs();
  var q=norm(QS),g={},o=[];
  M.menu.filter(function(p){return q?norm(p.name+' '+(p.description||'')+' '+(p.category||'')).indexOf(q)>=0:(cat==='__all'||(p.category||'Altro')===cat)})
    .forEach(function(p){var c=p.category||'Altro';if(!g[c]){g[c]=[];o.push(c)}g[c].push(p)});

  POP=null;
}
function prod(id){return M.menu.filter(function(p){return String(p.id)===String(id)})[0]}
function paintBar(){var n=count(),b=$('bar');b.classList.toggle('hide',!n);$('barBtn').innerHTML='<span class="c">'+n+'</span><span class="l">Vedi il tuo ordine</span><span class="t">'+euro(sub())+'</span>'}
function put(p,size,qty,rem,add){
  var sig=rem.slice().sort().join(',')+'#'+add.slice().sort().join(','),k=p.id+'|'+size+'|'+sig,price=(size==='Maxi'?p.pm:p.pn)+xsum(add);

  cart[k].qty=Math.min(20,cart[k].qty+qty);paintBar();POP=String(p.id);paintList();buzz(18);

}
function takeOne(id){
  var ks=Object.keys(cart).filter(function(k){return String(cart[k].id)===String(id)});if(!ks.length)return;
  var plain=ks.filter(function(k){return !cart[k].rem.length&&!cart[k].add.length}),k=(plain.length?plain:ks).pop();

}
$('chips').onclick=function(e){var b=e.target.closest('[data-c]');if(b){cat=b.getAttribute('data-c');QS='';$('q').value='';paintList()}};
$('q').oninput=function(){QS=this.value;paintList()};
$('list').onclick=function(e){
  var g=e.target.closest('[data-g]');if(g){openCustom(g.getAttribute('data-g'));return}
  var m=e.target.closest('[data-m]');if(m){takeOne(m.getAttribute('data-m'));return}
  var b=e.target.closest('[data-a]');if(!b)return;
  var a=b.getAttribute('data-a').split('|'),p=prod(a[0]);if(!p)return;
  put(p,a[1],1,[],[]);
};
$('barBtn').onclick=openSheet;

/* ---- personalizzazione ingredienti ---- */
function openCustom(id){var p=prod(id);if(!p)return;S={p:p,size:'Normale',qty:1,rem:{},add:{},q:''};$('sov').classList.remove('hide');drawCustom()}
function drawCustom(){
  var p=S.p,base=ings(p),bn=base.map(norm),h='',price=((S.size==='Maxi'?p.pm:p.pn)+xsum(Object.keys(S.add)))*S.qty;
  h+='<h2>'+esc(p.name)+'</h2><div class="mu">Tocca per togliere o aggiungere. Salse gratis, gli altri extra + € 2,00.</div>';
  if(p.pm>0) h+='<div class="seg"><button data-sz="Normale" class="'+(S.size==='Normale'?'on':'')+'">Normale · '+euro(p.pn)+'</button><button data-sz="Maxi" class="'+(S.size==='Maxi'?'on':'')+'">Maxi · '+euro(p.pm)+'</button></div>';
  if(base.length) h+='<div class="sec-t">Senza</div><div class="ing rm">'+base.map(function(i){return '<button data-r="'+esc(i)+'" class="'+(S.rem[i]?'on':'')+'">'+esc(i)+'</button>'}).join('')+'</div>';
  var q=norm(S.q),groups={},order=[];
  pool().forEach(function(i){if(q&&norm(i).indexOf(q)<0)return;var g=groupOf(i);if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(i)});
  h+='<div class="sec-t">Extra</div><input class="srch" id="sq" placeholder="Cerca un ingrediente" value="'+esc(S.q)+'">';
  order.sort().forEach(function(g){
    h+='<div class="mu" style="margin-top:8px;font-weight:500">'+g+'</div><div class="ing ex">'+groups[g].map(function(i){
      var dbl=bn.indexOf(norm(i))>=0;
      return '<button data-e="'+esc(i)+'" class="'+(S.add[i]?'on':'')+'">'+esc(i)+(dbl?' (doppio)':'')+' <small>'+(xp(i)?'+€ 2':'gratis')+'</small></button>'}).join('')+'</div>';
  });
  h+='<div class="tot g"><span>Totale</span><span>'+euro(price)+'</span></div>';
  h+='<div style="display:flex;gap:12px;align-items:center;margin-top:10px"><div class="q2"><button data-q="-1">−</button><b>'+S.qty+'</b><button data-q="1">+</button></div><button class="cta" id="sadd" style="flex:1;margin:0">Aggiungi all’ordine</button></div><button class="cta sec" id="scl">Annulla</button>';
  var fx=document.activeElement&&document.activeElement.id==='sq',bx=$('sbox'),st=bx.scrollTop;bx.innerHTML=h;bx.scrollTop=st;
  if(fx){var i=$('sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
$('sbox').onclick=function(e){
  var t;
  if((t=e.target.closest('[data-sz]'))){S.size=t.getAttribute('data-sz');drawCustom();return}
  if((t=e.target.closest('[data-r]'))){var r=t.getAttribute('data-r');if(S.rem[r])delete S.rem[r];else S.rem[r]=1;drawCustom();return}
  if((t=e.target.closest('[data-e]'))){var x=t.getAttribute('data-e');if(S.add[x])delete S.add[x];else S.add[x]=1;drawCustom();return}
  if((t=e.target.closest('[data-q]'))){S.qty=Math.max(1,Math.min(20,S.qty+Number(t.getAttribute('data-q'))));drawCustom();return}
  if(e.target.id==='scl'){$('sov').classList.add('hide');return}
  if(e.target.id==='sadd'){put(S.p,S.size,S.qty,Object.keys(S.rem),Object.keys(S.add));$('sov').classList.add('hide');return}
};
$('sbox').oninput=function(e){if(e.target.id==='sq'){S.q=e.target.value;drawCustom()}};
$('sov').onclick=function(e){if(e.target===$('sov'))$('sov').classList.add('hide')};
$('ov').onclick=function(e){if(e.target===$('ov'))$('ov').classList.add('hide')};

/* ---- riepilogo e invio ---- */
function modsHtml(l){return l.rem.map(function(x){return '<span class="tag no">'+esc(x)+'</span>'}).concat(l.add.map(function(x){return '<span class="tag ex">+ '+esc(x)+'</span>'})).join('')}
function slots(){
  var open=mins(M.open),close=mins(M.close),start=Math.max(Math.ceil((mins(M.now)+20)/15)*15,open),o='<option value="">Prima possibile</option>';
  for(var m=start;m<=close-15;m+=15)o+='<option value="'+hm(m)+'">'+hm(m)+'</option>';
  return o;
}
function openSheet(){
  var sv={};try{sv=JSON.parse(localStorage.getItem('bp_cust')||'{}')}catch(_){}
  $('box').innerHTML='<h2>Il tuo ordine</h2><div id="ls"></div><div id="tt"></div>'+
   '<label>Nome '+(TV?'(facoltativo)':'')+'</label><input id="fn" autocomplete="name" value="'+esc(sv.n||'')+'">'+
   '<label>Telefono <span class="mut">(facoltativo)</span></label><input id="fp" type="tel" autocomplete="tel" value="'+esc(sv.p||'')+'">'+
   '<div class="fam">Vuoi entrare nella famiglia Buona Pizza? Lascia il tuo numero: ti registreremo come cliente, con vantaggi, promo e punti fedeltà. Puoi ordinare anche senza.</div>'+
   '<label>Ritiro o consegna</label><select id="ft"><option value="Asporto">Ritiro in pizzeria</option><option value="Consegna">Consegna a domicilio</option></select>'+
   '<div id="fa" class="hide"><label>Indirizzo di consegna</label><input id="fd" autocomplete="street-address" value="'+esc(sv.a||'')+'" placeholder="Via, numero civico, citofono"></div>'+
   '<label>Orario</label><select id="fh">'+slots()+'</select>'+
   '<label>Note (facoltative)</label><textarea id="fo" rows="2"></textarea>'+
   '<div id="er"></div><button class="cta" id="go">Invia ordine</button><button class="cta sec" id="cl">Continua con la carta</button>';
  if(TV){
    $('box').insertAdjacentHTML('afterbegin','<div class="tvb">Tavolo '+TV+'</div>');
    $('ft').value='Asporto';[$('ft'),$('ft').previousElementSibling,$('fh'),$('fh').previousElementSibling].forEach(function(e){e.classList.add('hide')});
  }
  $('ov').classList.remove('hide');
  $('ft').onchange=function(){$('fa').classList.toggle('hide',$('ft').value!=='Consegna');upd()};
  $('cl').onclick=function(){$('ov').classList.add('hide')};
  $('go').onclick=send;upd();
}
function upd(){
  var ls=lines();if(!ls.length){$('ov').classList.add('hide');paintBar();paintList();return}
  $('ls').innerHTML=ls.map(function(l){var k=l.id+'|'+l.size+'|'+l.rem.slice().sort().join(',')+'#'+l.add.slice().sort().join(',');
    return '<div class="ln"><div><b>'+esc(l.name)+'</b>'+(l.size==='Maxi'?' <span class="tag ex">Maxi</span>':'')+'<div class="mu">'+euro(l.price)+'</div>'+(modsHtml(l)?'<div class="mods">'+modsHtml(l)+'</div>':'')+'</div><div class="q2"><button data-m="'+esc(k)+'" aria-label="Togli uno">−</button><b>'+l.qty+'</b><button data-p="'+esc(k)+'" aria-label="Aggiungi uno">+</button></div></div>'}).join('');
  var del=$('ft')&&$('ft').value==='Consegna'&&!TV,fee=del&&sub()<Number(M.free_from||0)?Number(M.fee||0):0;
  $('tt').innerHTML='<div class="tot"><span>Prodotti</span><span>'+euro(sub())+'</span></div>'+(fee>0?'<div class="tot"><span>Consegna</span><span>'+euro(fee)+'</span></div>':'')+'<div class="tot g"><span>Totale</span><span>'+euro(sub()+fee)+'</span></div>'+(fee>0?'<div class="mut" style="font-size:13px;margin-top:8px">Ordine sotto '+euro(M.free_from)+': aggiunti '+euro(fee)+' di consegna. Aggiungi ancora '+euro(M.free_from-sub())+' di prodotti per averla gratis.</div>':'');
  paintBar();paintList();
}
$('box').onclick=function(e){
  var m=e.target.closest('[data-m]'),p=e.target.closest('[data-p]');
  if(m){var k=m.getAttribute('data-m');if(cart[k]&&--cart[k].qty<=0)delete cart[k];upd()}
  if(p){var k2=p.getAttribute('data-p');if(cart[k2]&&cart[k2].qty<20)cart[k2].qty++;upd()}
};
var ERR={ONLINE_OFF:'Gli ordini online sono chiusi.',CLOSED:'Siamo fuori orario per gli ordini online.',BAD_NAME:'Inserisci il tuo nome.',BAD_PHONE:'Il locale non accetta ancora ordini senza telefono: inserisci il tuo numero.',BAD_ADDRESS:'Inserisci l’indirizzo di consegna.',BAD_ITEM:'Un prodotto non è più disponibile. Ricarica la pagina.',BAD_ITEMS:'Controlla le quantità.',MIN:'Non hai raggiunto l’ordine minimo.',RATE:'Troppi ordini ravvicinati. Chiamaci in pizzeria.'};
async function send(){
  if(busy)return;var er=$('er');er.innerHTML='';
  var n=$('fn').value.trim(),ph=$('fp').value.trim(),ty=$('ft').value,ad=$('fd').value.trim(),n0=n,tm=$('fh').value,nt=$('fo').value.trim();
  if(TV){ty='Asporto';ad='';tm='';n='Tavolo '+TV+(n?' · '+n:'');nt='TAVOLO '+TV+(nt?' · '+nt:'')}
  else if(n.length<2)n='Cliente online';
  if(ph&&ph.replace(/\D/g,'').length<8)return er.innerHTML='<div class="err">Numero di telefono non valido (oppure lascia il campo vuoto).</div>';
  if(ty==='Consegna'&&!TV&&!ph)return er.innerHTML='<div class="err">Per la consegna serve un numero di telefono, così il fattorino può chiamarti.</div>';
  if(ty==='Consegna'&&ad.length<5)return er.innerHTML='<div class="err">'+ERR.BAD_ADDRESS+'</div>';
  busy=true;$('go').disabled=true;$('go').textContent='Invio in corso…';
  try{
    var r=await sb.rpc('create_online_order',{p_name:n,p_phone:ph,p_type:ty,p_address:ad,p_time:tm,p_notes:nt,
      p_items:lines().map(function(l){return{id:String(l.id),size:l.size,qty:l.qty,rem:l.rem,add:l.add}})});
    if(r.error)throw r.error;
    if(ph){try{localStorage.setItem('bp_cust',JSON.stringify({n:n0,p:ph,a:ad}))}catch(_){}}
    cart={};busy=false;paintBar();paintList();buzz([30,40,30]);
    $('box').innerHTML='<div class="done"><div class="tri" style="margin:0 auto 14px"></div><h2>Grazie!</h2><p class="mu" style="margin:0">Ordine ricevuto'+(TV?' per il tavolo '+TV:'')+'</p><div class="no">#'+esc(r.data.id)+'</div><p>Il locale lo confermerà a breve.<br><span class="mut">'+(TV?'Si paga al tavolo. Buon appetito!':'Pagamento in contanti alla consegna o al ritiro.')+'</span></p></div>'+(ph?'<div class="fam">Benvenuto nella famiglia Buona Pizza!</div>':'')+'<a class="cta" href="track.html?t='+encodeURIComponent(r.data.token)+'">Segui il tuo ordine</a>';
  }catch(e){
    var msg=String((e&&e.message)||e),code=Object.keys(ERR).filter(function(c){return msg.indexOf(c)>=0})[0];
    er.innerHTML='<div class="err">'+esc(code?ERR[code]:'Errore: '+msg)+'</div>';
    busy=false;$('go').disabled=false;$('go').textContent='Invia ordine';
  }
}
init();
</script>
