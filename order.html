<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ordina · Buona Pizza</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e7eb;--ok:#16794b;--acc:#d92d20}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--card:#202327;--ink:#f1f3f5;--mut:#9aa3ad;--line:#333840}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(14px,env(safe-area-inset-top)) 14px 110px}
.wrap{max-width:560px;margin:0 auto}.brand{text-align:center;font-weight:800;font-size:21px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hide{display:none!important}.mut{color:var(--mut);font-size:13px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px;font-weight:700}
.chips button.on{background:var(--ink);color:var(--bg)}
.p{display:flex;justify-content:space-between;gap:10px;align-items:center}.p b{display:block}.p .d{color:var(--mut);font-size:13px;margin-top:2px}
.add{display:flex;gap:6px;flex:none;flex-direction:column}
.add button,.btn{border:0;border-radius:10px;background:var(--ok);color:#fff;font-weight:800;padding:9px 12px;font-size:14px}
.add button.mx{background:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);z-index:10}
.bar button{width:100%;padding:14px;font-size:16px}
.ov{position:fixed;inset:0;background:#0008;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px max(16px,env(safe-area-inset-bottom))}
.box h2{margin:0 0 8px}.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line)}
.q{display:flex;align-items:center;gap:8px}.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.g{font-weight:800;font-size:18px}
.err{background:#fef3f2;color:#b42318;border-radius:10px;padding:10px;margin-top:10px;font-size:14px}
#tv{margin:0 0 12px;border-radius:16px;overflow:hidden;background:#14213d;color:#fff;text-align:center;padding:16px 14px 14px;position:relative}
#tv:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#009246 33.3%,#fff 33.3% 66.6%,#ce2b37 66.6%)}
#tv small{display:block;letter-spacing:.22em;font-size:11px;opacity:.75;font-weight:700}
#tv h2{margin:4px 0 2px;font-size:24px;line-height:1.15}#tv h2 b{color:#ff6b6b}
#tv p{margin:0;font-size:13.5px;opacity:.85}
.tvb{display:inline-block;background:#ce2b37;color:#fff;border-radius:99px;padding:5px 14px;font-weight:800;letter-spacing:.06em;font-size:13px;margin-bottom:6px}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">🍕 Buona Pizza</div>
  <div id="tv" class="hide"></div>
  <div id="note" class="card hide"></div>
  <div id="chips" class="chips"></div>
  <div id="list"><div class="card mut">Caricamento menu…</div></div>
</div>
<div id="bar" class="bar hide"><button class="btn" id="barBtn"></button></div>
<div id="ov" class="ov hide"><div class="box" id="box"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var sb=window.supabase.createClient('https://jfgizazsjjgzyhqfngnl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmZ2l6YXpzampnenlocWZuZ25sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODI0ODEsImV4cCI6MjEwNzM1ODQ4MX0.Tp_bFfR-G55OaK5i3A0fi5gF6g7pc-a3LO_IDCpsuhE');
var M=null,cart={},cat='',canOrder=false,busy=false;
/* QR tavolo: order.html?tavolo=12 */
var TV=(function(){var n=parseInt(new URLSearchParams(location.search).get('tavolo'),10);if(n>=1&&n<=99){try{sessionStorage.setItem('bp_tavolo',n)}catch(_){}return n}try{var k=parseInt(sessionStorage.getItem('bp_tavolo'),10);return k>=1&&k<=99?k:0}catch(_){return 0}})();
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function euro(n){return '€ '+Number(n||0).toFixed(2).replace('.',',')}
function mins(h){var p=String(h).split(':');return +p[0]*60+ +p[1]}
function hm(m){return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+m%60).slice(-2)}
function note(t){var n=$('note');n.innerHTML=t;n.classList.toggle('hide',!t)}

async function init(){
  try{
    var r=await sb.rpc('get_online_menu'); if(r.error||!r.data) throw (r.error||'no data');
    M=r.data;
    var open=mins(M.open),close=mins(M.close),now=mins(M.now);
    if(!M.enabled) note('🔒 Gli ordini online sono momentaneamente chiusi.<br><span class="mut">Chiamaci in pizzeria!</span>');
    else if(now<open||now>=close) note('🕒 Ordini online dalle <b>'+esc(M.open)+'</b> alle <b>'+esc(M.close)+'</b>.');
    else{canOrder=true; var x=[]; if(M.min>0)x.push('ordine minimo '+euro(M.min)); if(M.fee>0)x.push('consegna '+euro(M.fee)); x.push(TV?'pagamento al tavolo':'pagamento alla consegna / al ritiro'); note('<span class="mut">'+esc(x.join(' · '))+'</span>');}
    if(TV){var t=$('tv');t.classList.remove('hide');t.innerHTML='<small>BUONA PIZZA</small><h2>Benvenuti al <b>Tavolo '+TV+'</b>!</h2><p>Scegli le tue pizze e invia: ti serviamo noi al tavolo. Buon appetito! 🍕</p>'}
    var cats=[]; M.menu.forEach(function(p){var c=p.category||'Altro'; if(cats.indexOf(c)<0)cats.push(c)});
    cat=cats[0]||''; $('chips').innerHTML=cats.map(function(c){return '<button data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join('');
    paintList();
  }catch(e){ $('list').innerHTML='<div class="card err">Impossibile caricare il menu.<br><small>'+esc((e&&e.message)||e)+'</small></div>'; }
}
function paintList(){
  document.querySelectorAll('#chips button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-c')===cat)});
  $('list').innerHTML=M.menu.filter(function(p){return (p.category||'Altro')===cat}).map(function(p){
    var btn='';
    if(canOrder){
      btn='<div class="add"><button data-a="'+esc(p.id)+'|Normale">+ '+euro(p.pn)+'</button>'+(p.pm>0?'<button class="mx" data-a="'+esc(p.id)+'|Maxi">+ Maxi '+euro(p.pm)+'</button>':'')+'</div>';
    }
    return '<div class="card p"><div><b>'+esc(p.name)+'</b>'+(p.description?'<div class="d">'+esc(p.description)+'</div>':'')+(canOrder?'':'<div class="d">'+euro(p.pn)+(p.pm>0?' · Maxi '+euro(p.pm):'')+'</div>')+'</div>'+btn+'</div>';
  }).join('')||'<div class="card mut">Nessun prodotto.</div>';
}
function prod(id){return M.menu.filter(function(p){return String(p.id)===String(id)})[0]}
function lines(){return Object.keys(cart).map(function(k){return cart[k]})}
function sub(){return lines().reduce(function(s,l){return s+l.price*l.qty},0)}
function count(){return lines().reduce(function(s,l){return s+l.qty},0)}
function paintBar(){
  var n=count(); $('bar').classList.toggle('hide',!n);
  $('barBtn').textContent='🛒 '+n+' · '+euro(sub())+' — Vedi ordine';
}
$('chips').onclick=function(e){var b=e.target.closest('[data-c]'); if(b){cat=b.getAttribute('data-c');paintList()}};
$('list').onclick=function(e){
  var b=e.target.closest('[data-a]'); if(!b)return;
  var a=b.getAttribute('data-a').split('|'),p=prod(a[0]); if(!p)return;
  var k=a[0]+'|'+a[1],price=a[1]==='Maxi'?p.pm:p.pn;
  if(!cart[k]) cart[k]={id:p.id,name:p.name,size:a[1],price:Number(price),qty:0};
  if(cart[k].qty<20) cart[k].qty++; paintBar();
  if(navigator.vibrate) try{navigator.vibrate(15)}catch(_){}
};
$('barBtn').onclick=openSheet;

function slots(){
  var open=mins(M.open),close=mins(M.close),start=Math.max(Math.ceil((mins(M.now)+20)/15)*15,open),o='<option value="">Prima possibile</option>';
  for(var m=start;m<=close-15;m+=15) o+='<option value="'+hm(m)+'">'+hm(m)+'</option>';
  return o;
}
function openSheet(){
  var sv={};try{sv=JSON.parse(localStorage.getItem('bp_cust')||'{}')}catch(_){}
  $('box').innerHTML='<h2>Il tuo ordine</h2><div id="ls"></div><div id="tt"></div>'+
   '<label>Nome</label><input id="fn" autocomplete="name" value="'+esc(sv.n||'')+'">'+
   '<label>Telefono</label><input id="fp" type="tel" autocomplete="tel" value="'+esc(sv.p||'')+'">'+
   '<label>Ritiro o consegna</label><select id="ft"><option value="Asporto">🛍️ Ritiro in pizzeria</option><option value="Consegna">🛵 Consegna a domicilio</option></select>'+
   '<div id="fa" class="hide"><label>Indirizzo di consegna</label><input id="fd" autocomplete="street-address" value="'+esc(sv.a||'')+'" placeholder="Via, numero civico, citofono"></div>'+
   '<label>Orario</label><select id="fh">'+slots()+'</select>'+
   '<label>Note (facoltative)</label><textarea id="fo" rows="2"></textarea>'+
   '<div id="er"></div><button class="btn" id="go" style="width:100%;padding:14px;font-size:16px;margin-top:12px">✅ Invia ordine</button>'+
   '<button class="btn" id="cl" style="width:100%;margin-top:8px;background:var(--mut)">Continua con il menu</button>';
  if(TV){
    $('box').insertAdjacentHTML('afterbegin','<div class="tvb">🍽️ TAVOLO '+TV+'</div>');
    $('ft').value='Asporto'; [$('ft'),$('ft').previousElementSibling,$('fh'),$('fh').previousElementSibling].forEach(function(e){e.classList.add('hide')});
    $('fn').previousElementSibling.textContent='Nome (facoltativo)'; $('fp').previousElementSibling.textContent='Telefono (per avvisarti se serve)';
  }
  $('ov').classList.remove('hide');
  $('ft').onchange=function(){$('fa').classList.toggle('hide',$('ft').value!=='Consegna');upd()};
  $('cl').onclick=function(){$('ov').classList.add('hide')};
  $('go').onclick=send; upd();
}
function upd(){
  var ls=lines(); if(!ls.length){$('ov').classList.add('hide');paintBar();return}
  $('ls').innerHTML=ls.map(function(l){var k=l.id+'|'+l.size;return '<div class="ln"><div>'+esc(l.name)+(l.size==='Maxi'?' <b>MAXI</b>':'')+'<div class="mut">'+euro(l.price)+'</div></div><div class="q"><button data-m="'+esc(k)+'">−</button><b>'+l.qty+'</b><button data-p="'+esc(k)+'">+</button></div></div>'}).join('');
  var del=$('ft')&&$('ft').value==='Consegna',fee=del?Number(M.fee||0):0;
  $('tt').innerHTML='<div class="tot"><span>Prodotti</span><span>'+euro(sub())+'</span></div>'+(fee>0?'<div class="tot"><span>Consegna</span><span>'+euro(fee)+'</span></div>':'')+'<div class="tot g"><span>Totale</span><span>'+euro(sub()+fee)+'</span></div>';
  paintBar();
}
$('box').onclick=function(e){
  var m=e.target.closest('[data-m]'),p=e.target.closest('[data-p]');
  if(m){var k=m.getAttribute('data-m');if(cart[k]&&--cart[k].qty<=0)delete cart[k];upd()}
  if(p){var k2=p.getAttribute('data-p');if(cart[k2]&&cart[k2].qty<20)cart[k2].qty++;upd()}
};
var ERR={ONLINE_OFF:'Gli ordini online sono chiusi.',CLOSED:'Siamo fuori orario per gli ordini online.',BAD_NAME:'Inserisci il tuo nome.',BAD_PHONE:'Numero di telefono non valido.',BAD_ADDRESS:'Inserisci l’indirizzo di consegna.',BAD_ITEM:'Un prodotto non è più disponibile. Ricarica la pagina.',BAD_ITEMS:'Controlla le quantità.',MIN:'Non hai raggiunto l’ordine minimo.',RATE:'Troppi ordini ravvicinati. Chiamaci in pizzeria.'};
async function send(){
  if(busy)return; var er=$('er'); er.innerHTML='';
  var n=$('fn').value.trim(),ph=$('fp').value.trim(),ty=$('ft').value,ad=$('fd').value.trim(),n0=n,tm=$('fh').value,nt=$('fo').value;
  if(TV){ty='Asporto';ad='';tm='';n='Tavolo '+TV+(n?' · '+n:'');nt='TAVOLO '+TV+(nt.trim()?' · '+nt.trim():'')}
  if(!TV&&n.length<2) return er.innerHTML='<div class="err">'+ERR.BAD_NAME+'</div>';
  if(ph.replace(/\D/g,'').length<8) return er.innerHTML='<div class="err">'+ERR.BAD_PHONE+'</div>';
  if(ty==='Consegna'&&ad.length<5) return er.innerHTML='<div class="err">'+ERR.BAD_ADDRESS+'</div>';
  if(M.min>0&&sub()<M.min) return er.innerHTML='<div class="err">Ordine minimo '+euro(M.min)+'.</div>';
  busy=true; $('go').disabled=true; $('go').textContent='Invio in corso…';
  try{
    var r=await sb.rpc('create_online_order',{p_name:n,p_phone:ph,p_type:ty,p_address:ad,p_time:tm,p_notes:nt,
      p_items:lines().map(function(l){return{id:String(l.id),size:l.size,qty:l.qty}})});
    if(r.error) throw r.error;
    try{localStorage.setItem('bp_cust',JSON.stringify({n:n0,p:ph,a:ad}))}catch(_){}
    cart={}; paintBar();
    $('box').innerHTML='<h2>✅ Ordine inviato!</h2><p>Il tuo ordine <b>#'+esc(r.data.id)+'</b>'+(TV?' per il <b>Tavolo '+TV+'</b>':'')+' è stato ricevuto. Il locale lo confermerà a breve.</p><p class="mut">'+(TV?'Pagamento al tavolo. Buon appetito! 🍕':'Pagamento in contanti alla consegna o al ritiro.')+'</p><a class="btn" href="track.html?t='+encodeURIComponent(r.data.token)+'">📍 Segui il tuo ordine</a>';
  }catch(e){
    var msg=String((e&&e.message)||e),code=Object.keys(ERR).filter(function(c){return msg.indexOf(c)>=0})[0];
    er.innerHTML='<div class="err">'+esc(code?ERR[code]:'Errore: '+msg)+'</div>';
    busy=false; $('go').disabled=false; $('go').textContent='✅ Invia ordine';
  }
}
init();
</script>
</body>
</html>
