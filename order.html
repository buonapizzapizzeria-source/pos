<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Ordina · Buona Pizza</title>
<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#231815;--mut:#7a6f66;--line:#efe5d6;--ok:#16794b;--acc:#c8102e;--acc2:#e8590c;--soft:#fff3e3;--shadow:0 6px 22px rgba(120,60,10,.10)}
@media(prefers-color-scheme:dark){:root{--bg:#14110f;--card:#1f1a17;--ink:#f6efe7;--mut:#a89c90;--line:#33291f;--soft:#2a211a;--shadow:0 6px 22px rgba(0,0,0,.4)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 120px}
.wrap{max-width:600px;margin:0 auto;padding:0 14px}
.hero{background:linear-gradient(135deg,#c8102e 0%,#e8590c 60%,#f59e0b 100%);color:#fff;padding:max(18px,env(safe-area-inset-top)) 16px 34px;text-align:center;border-radius:0 0 30px 30px;box-shadow:0 10px 28px rgba(200,16,46,.28);margin-bottom:-18px}
.hero .logo{font-size:44px;line-height:1}.hero img.logo{width:84px;height:84px;display:block;margin:0 auto 6px;background:#fff;padding:5px;border-radius:22px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hero h1{margin:4px 0 2px;font-size:26px;font-weight:900;letter-spacing:.3px}
.hero p{margin:0;opacity:.92;font-size:13.5px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.hide{display:none!important}.mut{color:var(--mut);font-size:13px}
#tv{border-radius:18px;background:linear-gradient(135deg,#14213d,#1f3a6b);color:#fff;text-align:center;padding:16px 14px;position:relative;overflow:hidden;margin-bottom:12px;box-shadow:var(--shadow)}
#tv:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#009246 33.3%,#fff 33.3% 66.6%,#ce2b37 66.6%)}
#tv small{display:block;letter-spacing:.22em;font-size:11px;opacity:.75;font-weight:700}
#tv h2{margin:4px 0 2px;font-size:23px}#tv h2 b{color:#ff8a8a}#tv p{margin:0;font-size:13.5px;opacity:.88}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 12px;position:sticky;top:0;background:linear-gradient(var(--bg) 78%,transparent);z-index:5;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 15px;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.chips button.hhc{border-color:#c7d7fe;color:#1d3fa8}.chips button.hhc.on{color:#fff}
.chips button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(200,16,46,.35)}
.p{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.p .ico{flex:none;width:52px;height:52px;border-radius:16px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:28px}
.p .info{flex:1;min-width:0}.p b{display:block;font-size:16px;font-weight:850}
.p .d{color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.3}
.p .pr{font-weight:800;color:var(--acc);font-size:13.5px;margin-top:3px}
.add{display:flex;gap:6px;flex:none;align-items:center}
.add .col{display:flex;flex-direction:column;gap:6px}
button{font:inherit;cursor:pointer}
.add button.q{border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;padding:9px 12px;font-size:13.5px;box-shadow:0 4px 10px rgba(22,121,75,.3)}
.add button.mx{background:var(--acc)}
.gear{flex:none;width:42px;height:42px;border-radius:14px;border:1.5px solid var(--line);background:var(--soft);color:var(--ink);font-size:20px;display:flex;align-items:center;justify-content:center}
.gear:active,.add .q:active{transform:scale(.94)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px max(10px,env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:10}
.btn{border:0;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:900;padding:15px;font-size:16px;width:100%;box-shadow:0 8px 20px rgba(200,16,46,.35)}
.btn.g{background:linear-gradient(135deg,#16794b,#0f5132);box-shadow:0 8px 20px rgba(22,121,75,.3)}
.btn.sec{background:var(--mut);box-shadow:none}
a.btn{display:block;text-align:center;text-decoration:none;margin-top:12px}
.ov{position:fixed;inset:0;background:rgba(20,10,5,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.box{background:var(--bg);width:100%;max-width:600px;max-height:93vh;overflow:auto;border-radius:26px 26px 0 0;padding:16px 14px max(16px,env(safe-area-inset-bottom))}
.box h2{margin:0 0 8px;font-size:21px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.ln .mods{margin-top:3px;display:flex;flex-wrap:wrap;gap:4px}
.q2{display:flex;align-items:center;gap:8px}.q2 button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px}
label{display:block;font-weight:800;margin:12px 0 4px;font-size:14px}
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit}
.tot{display:flex;justify-content:space-between;padding:4px 0}.tot.g{font-weight:900;font-size:19px}
.err{background:#fef3f2;color:#b42318;border-radius:12px;padding:10px;margin-top:10px;font-size:14px}
.tvb{display:inline-block;background:#ce2b37;color:#fff;border-radius:99px;padding:5px 14px;font-weight:800;letter-spacing:.06em;font-size:13px;margin-bottom:6px}
.fam{background:linear-gradient(135deg,#fff3e3,#ffe4d1);border:1.5px dashed #e8590c;color:#7a2e0e;border-radius:14px;padding:10px 12px;font-size:13.5px;font-weight:650;margin:6px 0 2px}
@media(prefers-color-scheme:dark){.fam{background:linear-gradient(135deg,#2e2016,#2a1a12);color:#ffd9b8}}
.tag{display:inline-block;border-radius:99px;padding:2px 9px;font-size:11.5px;font-weight:800}
.tag.no{background:#fee4e2;color:#b42318;text-decoration:line-through}.tag.ex{background:#dcfae6;color:#067647}
.ing{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.ing button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:9px 14px;font-weight:700;font-size:14px}
.ing.rm button.on{background:#fee4e2;border-color:#f04438;color:#b42318;text-decoration:line-through}
.ing.ex button.on{background:#dcfae6;border-color:#12b76a;color:#067647}
.sec-t{font-size:12.5px;font-weight:900;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 2px}
.seg{display:flex;gap:8px}.seg button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font-weight:800}.seg button.on{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.srch{margin-bottom:6px}
.pkh{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;margin-bottom:6px}.pkh .pi{font-size:32px;line-height:1}
.pkh .x{border:0;background:var(--soft);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:16px}
.pkt{display:flex;gap:8px;overflow-x:auto;padding:10px 0 8px;position:sticky;top:-16px;background:var(--bg);z-index:3;scrollbar-width:none}.pkt::-webkit-scrollbar{display:none}
.pkt button{flex:none;border:2.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.pkt button.on{background:var(--ok);border-color:var(--ok);color:#fff}
.pkt button.rem{border-color:#fecdca;color:#b42318}.pkt button.rem.on{background:#b42318;border-color:#b42318;color:#fff}
.pkt button.nt{border-color:#fedf89;color:#93370d}.pkt button.nt.on{background:#b54708;border-color:#b54708;color:#fff}
.bdg{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:99px;background:#fff;color:#16794b;font-size:12px;font-weight:900;line-height:20px}
.pkg{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin:4px 0 10px}
.tl{position:relative;border:2.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:104px}
.tl:active{transform:scale(.97)}
.tl .ic{font-size:34px;line-height:1}.tl .nm{font-weight:800;font-size:13px;line-height:1.15}.tl .pr{font-size:12px;font-weight:800;color:#b54708}.tl .pr.f{color:var(--ok)}
.tl.sel{border-color:#16794b;background:color-mix(in srgb,#16794b 16%,var(--card));box-shadow:0 0 0 3px rgba(22,121,75,.25)}
.tl.rem.sel{border-color:#b42318;background:color-mix(in srgb,#b42318 14%,var(--card));box-shadow:0 0 0 3px rgba(180,35,24,.22)}
.tl.rem.sel .nm{text-decoration:line-through}
.tl.sel::after{content:"✓";position:absolute;top:4px;right:9px;font-weight:900;color:#16794b}.tl.rem.sel::after{content:"✕";color:#b42318}
.ing3d{width:1em;height:1em;object-fit:contain;vertical-align:-.15em;pointer-events:none}
.pkf{position:sticky;bottom:-16px;background:var(--bg);padding:8px 0 4px;z-index:3;border-top:1px solid var(--line)}
.tag.nt{background:#fef0c7;color:#93370d}
.p .ico.ph{width:76px;height:76px;padding:0;overflow:hidden;border-radius:18px}.p .ico.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pkh .pi.ph{width:58px;height:58px;border-radius:16px;overflow:hidden;flex:none}.pkh .pi.ph img{width:100%;height:100%;object-fit:cover;display:block}
.pke{padding:18px 8px;text-align:center}

/* ===== menu a BLATTELLE (come "Nuovo ordine" del programma) ===== */
#list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
#list>.card{grid-column:1/-1}
.pt{position:relative;border-radius:20px;overflow:hidden;background:var(--bc,#8c1f16);box-shadow:var(--shadow);display:flex;flex-direction:column;transition:transform .12s}
.pt.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(.96)}}
.pt-img{position:relative;aspect-ratio:4/3;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:60px;overflow:hidden}
.pt-img img{width:100%;height:100%;object-fit:cover;display:block}
.pt-pr{position:absolute;right:8px;bottom:12px;background:#fff;color:var(--acc);font-weight:900;font-size:15px;border-radius:99px;padding:3px 11px;box-shadow:0 3px 10px rgba(0,0,0,.28);z-index:2}
.pt-qty{position:absolute;left:8px;top:8px;min-width:28px;height:28px;border-radius:99px;background:var(--ok);color:#fff;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 3px 10px rgba(0,0,0,.35);z-index:2}
.pt-body{position:relative;color:#fff;padding:7px 10px 4px;flex:1}
.pt-body:before{content:"";position:absolute;left:0;right:0;top:-7px;height:8px;background:radial-gradient(circle at 8px 8px,var(--bc,#8c1f16) 7px,transparent 7.6px) repeat-x;background-size:16px 8px}
.pt-name{font-weight:900;font-size:16px;line-height:1.15;text-align:center}
.pt-d{font-size:11.5px;line-height:1.25;opacity:.85;text-align:center;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pt-mx{text-align:center;font-size:12px;font-weight:800;opacity:.9;margin-top:3px}
.pt-act{display:flex;gap:6px;padding:6px 8px 9px;align-items:stretch}
.pt-act button{border:0;border-radius:12px;color:#fff;background:rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-weight:900;min-height:44px}
.pt-act button:active{transform:scale(.94)}
.pt-act .ab-mx{flex:1.4;background:linear-gradient(#f6d365,#e5a823);color:#4a2b00;font-size:12px}
.pt-act .ab-mx b{font-size:13.5px;white-space:nowrap}.pt-act .ab-mn small{white-space:nowrap}
.pt-act .ab-mn{flex:1;background:linear-gradient(#ffd8a8,#f4a261);color:#5a2a00;font-size:19px}
.pt-act .ab-mn small{font-size:10.5px;font-weight:900}
.pt-act .ab-g{flex:none;width:44px;font-size:20px}
.pt-act .ab-g:only-child{flex:1}
#toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(20px);background:#16794b;color:#fff;font-weight:800;border-radius:99px;padding:10px 18px;opacity:0;pointer-events:none;transition:.25s;z-index:40;box-shadow:0 8px 20px rgba(0,0,0,.3);max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.mnu{display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 0;border:2px dashed #e8590c;background:linear-gradient(135deg,#fff3e3,#ffe4d1);color:#7a2e0e;border-radius:14px;padding:10px 12px;font-weight:800;text-align:left}
.mnu .mi{font-size:26px}.mnu .mt{flex:1;line-height:1.2}.mnu .mt small{display:block;font-weight:600;opacity:.8;font-size:12px}
.mnu .mc{width:26px;height:26px;border-radius:8px;border:2px solid #e8590c;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
.mnu.on{border-style:solid;border-color:#16794b;background:color-mix(in srgb,#16794b 16%,var(--card));color:var(--ink)}
.mnu.on .mc{background:#16794b;border-color:#16794b}
.pt-st{position:absolute;left:8px;bottom:12px;display:flex;align-items:center;background:#fff;border-radius:99px;box-shadow:0 3px 10px rgba(0,0,0,.28);z-index:3;overflow:hidden}
.pt-st button{width:38px;height:36px;border:0;background:transparent;font-size:22px;font-weight:900;color:var(--acc);line-height:1;padding:0}
.pt-st button.pl{background:var(--ok);color:#fff}
.pt-st button:active{transform:scale(.9)}
.pt-st b{min-width:24px;text-align:center;color:#111;font-size:15px}
.pt-st.z{background:transparent;box-shadow:none;overflow:visible}
.pt-st.z .mn,.pt-st.z b{display:none}
.pt-st.z .pl{width:40px;height:40px;border-radius:50%;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.pkt button.hh{border-color:#c7d7fe;color:#1d3fa8}.pkt button.hh.on{background:#1d4ed8;border-color:#1d4ed8;color:#fff}
.hhs{margin:10px 0 0;padding:9px 12px;border-radius:14px;background:#eef4ff;border:2px solid #c7d7fe;color:#1d3fa8;font-weight:800;font-size:14px;line-height:1.3}
.hhi{font-size:13px;margin:10px 0 8px}
.hsl-l{font-size:12.5px;font-weight:800;margin:12px 0 6px}.hsl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.hsl button{flex:1 1 40%;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 8px;font-weight:800;font-size:14px}.hsl button.on{border-color:#1d4ed8;background:color-mix(in srgb,#1d4ed8 14%,var(--card));color:#1d3fa8}
.seg.s4 button{padding:10px 2px;font-size:13px}
.tl.hhsel{border-color:#1d4ed8;background:color-mix(in srgb,#1d4ed8 14%,var(--card));box-shadow:0 0 0 3px rgba(29,78,216,.25)}
.tl.hhsel::after{content:"✓";position:absolute;top:4px;right:9px;font-weight:900;color:#1d4ed8}
.pkt button.dis{opacity:.45}
@media(prefers-color-scheme:dark){.mnu:not(.on){background:linear-gradient(135deg,#2e2016,#2a1a12);color:#ffd9b8}}
/* ===== metà e metà: layout a schede (come POS) ===== */
#list>.hhbox{grid-column:1/-1}
.hh-lbl{font-size:11.5px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:16px 2px 8px}
.hh-types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hh-types button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:800;font-size:13px}
.hh-types button.on{border-color:#7c3aed;background:color-mix(in srgb,#7c3aed 16%,var(--card));color:#7c3aed}
.hh-big{font-size:22px;line-height:1;font-weight:900}
.hh-types small{font-size:12px;font-weight:800}
.hh-slots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hh-slot{position:relative;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:12px 10px 10px;display:flex;flex-direction:column;gap:5px;min-height:170px;box-shadow:var(--shadow);cursor:pointer}
.hh-slot.on{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.22)}
.hh-slot.empty{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--mut)}
.hh-n{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#7c3aed,#e8590c);color:#fff;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center}
.hh-nm{font-weight:900;font-size:15px;line-height:1.2}
.hh-d{font-size:11.5px;line-height:1.3;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hh-mod{font-size:11.5px;font-weight:800;color:#1d3fa8;line-height:1.25}
.hh-p{margin-top:auto;font-weight:900;color:#b54708;font-size:14px}
.hh-plus{font-size:34px;line-height:1;color:#7c3aed;font-weight:300}
.hh-cu{border:2px solid #c7d7fe;background:#eef4ff;color:#1d3fa8;border-radius:12px;padding:8px 6px;font-weight:800;font-size:12.5px}
.hh-pkg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:4px 0 10px}
.hh-pz{position:relative;border:2.5px solid var(--line);border-radius:18px;overflow:hidden;padding:0;background:var(--card);aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;cursor:pointer;box-shadow:var(--shadow)}
.hh-pz img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hh-pz::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.85));z-index:0}
.hh-pe{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--soft)}
.hh-pzn{position:relative;z-index:1;padding:8px;text-align:left}
.hh-pzn b{display:block;font-size:13px;line-height:1.15;font-weight:900;text-shadow:0 1px 3px #000}
.hh-pzn small{font-size:12.5px;font-weight:900;color:#ffb36b}
.hh-pz.sel{border-color:#7c3aed;box-shadow:0 0 0 3px rgba(124,58,237,.5)}
.hh-pz.sel::before{content:"✓";position:absolute;top:6px;right:6px;z-index:2;background:#7c3aed;color:#fff;border-radius:99px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:900}
.hh-tags{display:flex;flex-wrap:wrap;gap:4px;min-height:22px}
.hh-tag{font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;line-height:1.5}
.hh-tag.no{background:#fee4e2;color:#b42318;text-decoration:line-through}
.hh-tag.ex{background:#dcfae6;color:#067647}
.hh-tag.none{color:var(--mut);font-weight:600;padding:0}
.hh-tot{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px;padding:14px 16px;border-radius:18px;background:linear-gradient(135deg,#1c1530,#2a1a12);color:#fff;border:1px solid #7c3aed55}
.hh-tot small{display:block;font-size:12px;opacity:.8;font-weight:700}
.hh-tot b{letter-spacing:.12em;font-size:13px;opacity:.9}
.hh-tot strong{font-size:30px;font-weight:900;color:#ffa552}
@media(min-width:700px){.wrap{max-width:900px}#list{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:340px){#list{grid-template-columns:1fr}}
/* ===== guida (README) cliente: AR / IT ===== */
.gbtn{display:flex;align-items:center;gap:12px;width:100%;margin:28px 0 0;padding:14px 16px;border-radius:18px;border:2px solid #7c3aed66;background:linear-gradient(135deg,#1c1530,#2a1a12);color:#fff;font-weight:900;font-size:16px;text-align:left;box-shadow:var(--shadow)}
.gbtn .gi{font-size:30px}.gbtn small{display:block;font-weight:700;opacity:.8;font-size:12.5px;margin-top:2px}
.gbox{direction:ltr;text-align:left}.gbox[dir=rtl]{direction:rtl;text-align:right}
.gtop{display:flex;justify-content:space-between;align-items:center;gap:10px}.gtop h2{margin:0;font-size:21px}
.gx{border:0;background:var(--soft);color:var(--ink);width:38px;height:38px;border-radius:12px;font-size:16px;flex:none}
.glang{display:flex;gap:8px;margin:12px 0 4px}.glang button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px;font-weight:900;font-size:15px}
.glang button.on{border-color:var(--acc);background:var(--soft);color:var(--acc)}
.gsec{margin:18px 0 4px;font-size:17px;font-weight:900;color:var(--acc)}
.gbox ol{padding-inline-start:22px;margin:6px 0 8px}.gbox li{margin:8px 0;line-height:1.55;font-size:15px}
.gbox .gnote{background:var(--soft);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.5}
.gok{width:100%;margin-top:16px}
</style>

<script>
/* ====== PRENOTAZIONE TAVOLO (cliente) ====== */
(function(){
 var RES_TABLES = 30;   /* numero di tavoli del locale: cambialo se serve */
 var RES_MIN = 60;      /* durata prenotazione in minuti (uguale all'app) */
 var RES_DAYS = 14;     /* quanti giorni in avanti si può prenotare */
 var RES_ERR = {BAD_NAME:'Inserisci il tuo nome.', BAD_PHONE:'Inserisci un numero di telefono valido.', BAD_TIME:'L’orario scelto è già passato.', TABLE_BUSY:'Quell’orario non è più disponibile, scegli un altro orario.', TOO_MANY:'Hai già prenotazioni attive con questo numero. Chiamaci per modificarle o aggiungerne altre.', RES_FULL:'Le prenotazioni online sono temporaneamente sospese. Chiamaci per prenotare.'};
 if(typeof TV !== 'undefined' && TV) return; /* se si ordina dal QR del tavolo non serve */
 function two(n){ return String(n).padStart(2,'0'); }
 function ymd(d){ return d.getFullYear() + '-' + two(d.getMonth()+1) + '-' + two(d.getDate()); }
 function hours(){
  var o = 18*60, c = 23*60;
  try{ if(M && M.open) o = mins(M.open); if(M && M.close) c = mins(M.close); }catch(e){}
  if(c <= o) c += 1440;
  return [o, c];
 }
 function slotsFor(dateStr){
  var h = hours(), p = dateStr.split('-'), base = new Date(+p[0], +p[1]-1, +p[2], 0, 0, 0, 0), out = [], now = Date.now() + 30*60000;
  for(var m = h[0]; m <= h[1] - 60; m += 30){
   var d = new Date(base.getTime() + m*60000);
   if(d.getTime() >= now) out.push({v: d.toISOString(), t: two(d.getHours()) + ':' + two(d.getMinutes())});
  }
  return out;
 }
 function dayOpts(){
  var out = [], t = new Date();
  for(var i = 0; i < RES_DAYS; i++){
   var d = new Date(t.getFullYear(), t.getMonth(), t.getDate() + i);
   var s = ymd(d);
   if(!slotsFor(s).length) continue;
   var lab = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
   out.push('<option value="' + s + '">' + (i === 0 ? 'Oggi · ' : (i === 1 ? 'Domani · ' : '')) + esc(lab) + '</option>');
  }
  return out;
 }
 function ensureOv(){
  var ov = document.getElementById('rov');
  if(ov) return ov;
  ov = document.createElement('div'); ov.id = 'rov'; ov.className = 'ov hide'; ov.style.zIndex = '25';
  ov.innerHTML = '<div class="box" id="rbox"></div>';
  document.body.appendChild(ov);
  ov.addEventListener('click', function(e){ if(e.target === ov) ov.classList.add('hide'); });
  return ov;
 }
 function fillTimes(){
  var d = document.getElementById('rd'), t = document.getElementById('rt');
  if(!d || !t) return;
  t.innerHTML = slotsFor(d.value).map(function(s){ return '<option value="' + s.v + '">' + s.t + '</option>'; }).join('');
 }
 function openRes(){
  var ov = ensureOv(), box = document.getElementById('rbox'), days = dayOpts(), saved = {};
  try{ saved = JSON.parse(localStorage.getItem('bp_cust') || '{}') || {}; }catch(e){}
  if(!days.length){
   box.innerHTML = '<h2>🍽️ Prenota un tavolo</h2><div class="err">Al momento non ci sono orari disponibili per prenotare online. Chiamaci per prenotare.</div><button class="btn sec" id="rx" style="margin-top:12px">Chiudi</button>';
   document.getElementById('rx').onclick = function(){ ov.classList.add('hide'); };
   ov.classList.remove('hide'); return;
  }

  box.innerHTML = '<h2>🍽️ Prenota un tavolo</h2><div class="mut">حجز طاولة · Il locale confermerà la prenotazione</div>' +
   '<label>Giorno</label><select id="rd">' + days.join('') + '</select>' +
   '<label>Orario</label><select id="rt"></select>' +
   '<label>Persone</label><select id="rp">' + pp + '</select>' +
   '<label>Nome</label><input id="rn" placeholder="Il tuo nome" autocomplete="name" value="' + esc(saved.n || '') + '">' +
   '<label>Telefono</label><input id="rph" type="tel" placeholder="Il tuo numero" autocomplete="tel" value="' + esc(saved.p || '') + '">' +
   '<label>Note (facoltativo)</label><textarea id="ro" rows="2" placeholder="Es. seggiolone, allergie…"></textarea>' +
   '<div id="rer"></div>' +
   '<button class="btn g" id="rgo" style="margin-top:12px">✅ Invia prenotazione</button>' +
   '<button class="btn sec" id="rx" style="margin-top:8px">Annulla</button>';

  document.getElementById('rx').onclick = function(){ ov.classList.add('hide'); };
  document.getElementById('rgo').onclick = sendRes;
  ov.classList.remove('hide');
 }

 async function sendRes(){
  if(resBusy) return;
  var er = document.getElementById('rer'), go = document.getElementById('rgo');
  er.innerHTML = '';
  var at = document.getElementById('rt').value, n = document.getElementById('rn').value.trim(), ph = document.getElementById('rph').value.trim(),
      party = Number(document.getElementById('rp').value) || 2, nt = document.getElementById('ro').value.trim();
  if(!at) return er.innerHTML = '<div class="err">Scegli un orario.</div>';
  if(n.length < 2) return er.innerHTML = '<div class="err">' + RES_ERR.BAD_NAME + '</div>';
  if(ph.replace(/\D/g,'').length < 8) return er.innerHTML = '<div class="err">' + RES_ERR.BAD_PHONE + '</div>';
  resBusy = true; go.disabled = true; go.textContent = 'Invio in corso…';
  try{
   var b = await sb.rpc('busy_tables', {p_at: at, p_minutes: RES_MIN});
   if(b.error) throw b.error;
   var busyNo = {}; (b.data || []).forEach(function(x){ busyNo[x.table_no] = 1; });
   var free = []; for(var t = 1; t <= RES_TABLES; t++) if(!busyNo[t]) free.push(t);
   if(!free.length) throw new Error('NO_TABLE');
   var done = false, lastErr = null;
   for(var k = 0; k < Math.min(free.length, 4) && !done; k++){
    var r = await sb.rpc('create_online_reservation', {p_table: free[k], p_at: at, p_name: n, p_phone: ph, p_party: party, p_notes: nt});
    if(r.error){ lastErr = r.error; if(String(r.error.message || '').indexOf('TABLE_BUSY') < 0) throw r.error; } else done = true;
   }
   if(!done) throw (lastErr || new Error('NO_TABLE'));
   try{ var cur = JSON.parse(localStorage.getItem('bp_cust') || '{}') || {}; cur.n = n; cur.p = ph; localStorage.setItem('bp_cust', JSON.stringify(cur)); }catch(e){}
   var d = new Date(at), lab = d.toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'}) + ' alle ' + two(d.getHours()) + ':' + two(d.getMinutes());
   document.getElementById('rbox').innerHTML = '<h2>✅ Prenotazione inviata!</h2><p>Tavolo per <b>' + party + (party === 1 ? ' persona' : ' persone') + '</b>, <b>' + esc(lab) + '</b>, a nome <b>' + esc(n) + '</b>.</p><p class="mut">Il locale la confermerà a breve. Se serve ti chiameremo al numero indicato. تم إرسال الحجز 🍕</p><button class="btn" id="rx2" style="margin-top:12px">Chiudi</button>';
   document.getElementById('rx2').onclick = function(){ document.getElementById('rov').classList.add('hide'); };
  }catch(e){
   var msg = String((e && e.message) || e), code = Object.keys(RES_ERR).filter(function(c){ return msg.indexOf(c) >= 0; })[0];
   er.innerHTML = '<div class="err">' + esc(msg.indexOf('NO_TABLE') >= 0 ? 'Nessun tavolo disponibile a quell’orario: prova un altro orario.' : (code ? RES_ERR[code] : 'Errore: ' + msg)) + '</div>';
   resBusy = false; go.disabled = false; go.textContent = '✅ Invia prenotazione';
   return;
  }
  resBusy = false;
 }
 function mount(){
  if(document.getElementById('resCard')) return;
  var chips = document.getElementById('chips'); if(!chips || !chips.parentNode) return;
  var c = document.createElement('div'); c.id = 'resCard'; c.className = 'card'; c.style.cssText = 'margin-top:28px;display:flex;align-items:center;gap:12px';
  c.innerHTML = '<div style="font-size:30px">🍽️</div><div style="flex:1;min-width:0"><b style="display:block">Prenota un tavolo</b><span class="mut">حجز طاولة</span></div><button class="btn g" id="resBtn" style="width:auto;padding:11px 16px;font-size:15px">📅 Prenota</button>';
  chips.parentNode.insertBefore(c, chips);

 }
 mount();
})();

var lang='ar';try{lang=localStorage.getItem('bp_lang')||'ar'}catch(_){}
function render(){
 var L=C[lang],box=document.getElementById('gbox');
 box.setAttribute('dir',lang==='ar'?'rtl':'ltr');
 var h='<div class="gtop"><h2>❓ '+L.title+'</h2><button type="button" class="gx" id="gX" aria-label="close">'+L.x+'</button></div>';
 h+='<div class="glang"><button type="button" data-l="ar" class="'+(lang==='ar'?'on':'')+'">عربي</button><button type="button" data-l="it" class="'+(lang==='it'?'on':'')+'">Italiano</button></div>';
 L.secs.forEach(function(sec){
  h+='<div class="gsec">'+sec.h+'</div><ol>'+sec.ol.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol>';
  if(sec.note)h+='<div class="gnote">'+sec.note+'</div>';
 });
 h+='<button type="button" class="btn g gok" id="gOk">'+L.close+'</button>';
 box.innerHTML=h;
 box.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){lang=b.getAttribute('data-l');try{localStorage.setItem('bp_lang',lang)}catch(_){}render()}});
 document.getElementById('gX').onclick=close;
 document.getElementById('gOk').onclick=close;
}
function open(){render();document.getElementById('gov').classList.remove('hide')}
function close(){document.getElementById('gov').classList.add('hide');try{localStorage.setItem('bp_guide_seen','1')}catch(_){}}
document.getElementById('gBtn').onclick=open;
document.getElementById('gov').addEventListener('click',function(e){if(e.target===this)close()});
/* si apre da solo alla prima visita; poi resta il pulsante ❓ */
try{if(!localStorage.getItem('bp_guide_seen'))open()}catch(_){open()}
})();
</script>
