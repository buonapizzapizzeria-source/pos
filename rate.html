<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Come è andata? · Buona Pizza</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1f2328;--mut:#6b7280;--line:#e5e7eb;--ok:#16794b;--st:#f5a524}
@media(prefers-color-scheme:dark){:root{--bg:#16181b;--card:#202327;--ink:#f1f3f5;--mut:#9aa3ad;--line:#333840}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px 24px}
.wrap{max-width:480px;margin:0 auto}.brand{text-align:center;font-weight:800;font-size:20px;margin:6px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center}
h1{font-size:22px;margin:0 0 6px}.mut{color:var(--mut);font-size:14px}
.stars{display:flex;justify-content:center;gap:6px;margin:18px 0}
.stars button{background:none;border:0;font-size:44px;line-height:1;color:var(--line);cursor:pointer;padding:2px}
.stars button.on{color:var(--st)}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;margin-top:12px}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--ok);color:#fff;font-weight:800;font-size:16px;padding:14px;margin-top:12px;text-decoration:none;text-align:center}
</style>
</head>
<body><div class="wrap"><div class="brand">🍕 Buona Pizza</div><div class="card" id="c"><p class="mut">Caricamento…</p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var GOOGLE='https://search.google.com/local/writereview?placeid=ChIJDQv27rAsgUcRLVWzwXo5kzY';
var sb=window.supabase.createClient('https://jfgizazsjjgzyhqfngnl.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpmZ2l6YXpzampnenlocWZuZ25sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3ODI0ODEsImV4cCI6MjEwNzM1ODQ4MX0.Tp_bFfR-G55OaK5i3A0fi5gF6g7pc-a3LO_IDCpsuhE');
var token=new URLSearchParams(location.search).get('t')||'',c=document.getElementById('c'),rating=0,name='';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(x){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]})}
function stars(){return '<div class="stars">'+[1,2,3,4,5].map(function(i){return '<button data-r="'+i+'" aria-label="'+i+' stelle">★</button>'}).join('')+'</div>'}
async function init(){
  if(!token){c.innerHTML='<p class="mut">Link non valido.</p>';return}
  try{var r=await sb.rpc('get_order_tracking',{p_token:token}); if(r.error||!r.data){c.innerHTML='<p class="mut">Ordine non trovato. Controlla il link.</p>';return} name=r.data.first_name||'';}
  catch(e){c.innerHTML='<p class="mut">Impossibile caricare. Riprova tra poco.</p>';return}
  c.innerHTML='<h1>Com’è andata'+(name?', '+esc(name):'')+'?</h1><p class="mut">Tocca le stelle per votare il tuo ordine.</p>'+stars();
}
async function save(r,comment){
  var x=await sb.rpc('submit_feedback',{p_token:token,p_rating:r,p_comment:comment||''});
  if(x.error) throw x.error;
}
c.onclick=async function(e){
  var b=e.target.closest('[data-r]'); if(b&&!rating){
    rating=+b.getAttribute('data-r');
    document.querySelectorAll('.stars button').forEach(function(s){s.classList.toggle('on',+s.getAttribute('data-r')<=rating)});
    try{await save(rating)}catch(err){rating=0;c.insertAdjacentHTML('beforeend','<p class="mut">Errore: '+esc(err.message||err)+'</p>');return}
    if(rating>=4) c.innerHTML='<h1>Grazie! 🎉</h1><p class="mut">Siamo contenti che ti sia piaciuto. Ci aiuteresti con una recensione su Google? Ci vuole un minuto.</p><a class="btn" href="'+GOOGLE+'">⭐ Scrivi una recensione su Google</a>';
    else c.innerHTML='<h1>Ci dispiace 😔</h1><p class="mut">Dicci cosa non è andato bene: lo leggiamo personalmente e ci facciamo sentire noi.</p><textarea id="t" rows="4" maxlength="500" placeholder="Cosa possiamo migliorare?"></textarea><button class="btn" id="s">Invia</button>';
    return;
  }
  if(e.target.id==='s'){
    e.target.disabled=true;
    try{await save(rating,document.getElementById('t').value); c.innerHTML='<h1>Grazie 🙏</h1><p class="mut">Abbiamo ricevuto il tuo messaggio e ti contatteremo presto.</p>';}
    catch(err){e.target.disabled=false;c.insertAdjacentHTML('beforeend','<p class="mut">Errore: '+esc(err.message||err)+'</p>')}
  }
};
init();
</script></body></html>
